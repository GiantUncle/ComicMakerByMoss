<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ComicMaker</title>
    <script>
      // Apply the stored theme before first paint, so there is no flash.
      try {
        var t = localStorage.getItem("cm.theme") || "system";
        if (t !== "system") document.documentElement.dataset.theme = t;
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
